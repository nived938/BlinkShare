name = "blinkshare-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "BlinkShare"
APP_URL = "http://localhost:5173"
RATE_LIMIT_SECRET = "dev-rate-limit-secret-key-32chars!"
SESSION_SECRET = "dev-session-secret-key-32chars!!"
MAX_IMAGE_BYTES = "5242880"
MAX_TEXT_BYTES = "102400"

[[d1_databases]]
binding = "DB"
database_name = "blinkshare-db"
database_id = "63ec2816-7094-4b68-b78a-381677a257e9"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "IMAGE_STORE"
id = "blinkshare-image-store"

[triggers]
crons = ["* * * * *"]
